name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - catalog/games.json # commits automáticos do catalog.yml
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # rcheevos

      - name: Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Frontend (tipos + build)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Testes Rust
        run: cargo test --workspace

      - name: Testes Rust com conquistas automáticas (módulo guardado)
        run: cargo test -p recomphub --features auto-trophies
