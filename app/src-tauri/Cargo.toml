[package]
name = "recomphub"
version = "0.2.0"
description = "Launcher de jogos recomp com sistema de conquistas"
authors = ["RecompHub"]
edition = "2024"

[lib]
# O sufixo `_lib` evita conflito entre os nomes da lib e do binário no Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "recomphub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
recomphub-catalog.workspace = true
recomphub-memory.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["fs", "macros"] }
futures-util = "0.3.34"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11.1"
globset = "0.4.20"
thiserror = "2.0.21"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tar = "0.4.46"
flate2 = "1.1.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
