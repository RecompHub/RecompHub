[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/achievements", "crates/catalog", "crates/memory", "tools/catalog-builder"]

[workspace.dependencies]
recomphub-catalog = { path = "crates/catalog" }
recomphub-memory = { path = "crates/memory" }
recomphub-achievements = { path = "crates/achievements" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = "1.53.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }

# Ver https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
